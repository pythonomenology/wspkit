name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; jobs opt in to what they need.
permissions: {}

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  STABLE_PYTHON_VERSION: "3.13"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.STABLE_PYTHON_VERSION }}

      - name: Install Hatch
        uses: pypa/hatch@f647ed70d49adb885f53a27d1c7f5bdaeacf2c60 # install

      - name: Build sdist and wheel
        run: hatch build

      - name: Verify metadata
        run: pipx run twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/wspkit/
    permissions:
      # Mint the short-lived OIDC token PyPI Trusted Publishing exchanges
      # for an upload credential. No API token is stored in the repo.
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  github-release:
    name: GitHub release (immutable)
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      # Create the release and attach assets.
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Create draft, attach artifacts, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 1. Create the release as a draft bound to the pushed tag.
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            --draft
          # 2. Copy the built sdist and wheel into the draft release.
          gh release upload "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
          # 3. Publish. With repo Immutable Releases enabled, publishing
          #    seals the tag and assets so they can no longer be altered.
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false
