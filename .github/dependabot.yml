version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current (and re-pin to new SHAs).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait before adopting brand-new releases, reducing exposure to a
    # compromised or yanked version being pulled in immediately.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  # Keep Python dependencies current.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
