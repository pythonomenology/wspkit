[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "wspkit"
dynamic = ["version"]
description = "The whitespace between your workflow tool and everything that talks to it. A Python library providing the JSON-RPC server for the Workflow Server Protocol (WSP)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "workflow",
    "environment"
]
authors = [
     { name = "Cary Hawkins", email = "hawkinscary23@gmail.com" },
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "tomli; python_version < \"3.11\"",
]

[project.urls]
Homepage = "https://pythonomenology.github.io/wspkit/"
Documentation = "https://pythonomenology.github.io/wspkit/"
Sponsor = "https://github.com/sponsors/cjames23"
History = "https://github.com/pythonomenology/wspkit/releases"
Tracker = "https://github.com/pythonomenology/wspkit/issues"
Source = "https://github.com/pythonomenology/wspkit/"

[project.scripts]
wsp = "wspkit.cli.main:main"

# Version is derived from the latest git tag (e.g. tag v0.0.1 -> 0.0.1).
# No version lives in this file; the tag is the single source of truth.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/wspkit"]

[tool.hatch.envs.hatch-test]
parallel = true
extra-dependencies = [
    "hypothesis",
]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.14", "3.14t", "3.13", "3.12", "3.11", "3.10"]


[tool.hatch.envs.hatch-check-types]
extra-dependencies = [
  "hypothesis",
]

# Documentation environment. Build the site with `hatch run docs:build`,
# preview locally with `hatch run docs:serve`, and deploy with
# `hatch run docs:deploy`.
[tool.hatch.envs.docs]
detached = true
dependencies = [
  "zensical",
]

[tool.hatch.envs.docs.scripts]
serve = "zensical serve {args}"
build = "zensical build {args}"
deploy = "zensical gh-deploy --force {args}"

# Release tooling. All scripts are stdlib-only and shell out to git, so the
# environment needs no dependencies.
#   hatch run release:tag <version>     prepare + tag + push (triggers release.yml)
#   hatch run release:changelog <ver>   roll Unreleased into a dated version section
#   hatch run release:notes <ver>       print a version's changelog notes
#   hatch run release:github <version>  open the prefilled GitHub release form
[tool.hatch.envs.release]
detached = true

[tool.hatch.envs.release.scripts]
tag = "python scripts/release.py {args}"
changelog = "python scripts/changelog.py release {args}"
notes = "python scripts/changelog.py extract {args}"
github = "python scripts/release_github.py {args}"

[tool.pyrefly]
preset = "strict"
# Release scripts import their siblings (e.g. release.py imports changelog);
# they run with scripts/ on sys.path, so treat it as an import root too.
search-path = ["src", "scripts"]
