# Zensical configuration for the wspkit documentation site.
#
# Build:    hatch run docs:build
# Preview:  hatch run docs:serve  (then open http://localhost:8000)
# Deploy:   hatch run docs:deploy
#
# See https://zensical.org/docs/setup/basics/ for the full settings reference.

[project]
site_name = "wspkit"
site_description = "The whitespace between your workflow tool and everything that talks to it — a Python library implementing the Workflow Server Protocol (WSP)."
site_author = "Cary Hawkins"
site_url = "https://pythonomenology.github.io/wspkit/"
copyright = "&copy; 2026 Cary Hawkins"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Concepts" = [
    "concepts/index.md",
    { "Protocol overview" = "concepts/protocol.md" },
    { "Lifecycle" = "concepts/lifecycle.md" },
    { "Error model" = "concepts/errors.md" },
    { "Transport & framing" = "concepts/transport.md" },
  ] },
  { "Guides" = [
    "guides/index.md",
    { "Embed wspkit in a workflow tool" = "guides/embed-library.md" },
    { "Ship a Config_File" = "guides/config-file.md" },
    { "Adapt an existing CLI" = "guides/adapt-cli.md" },
    { "Use the wsp CLI" = "guides/cli.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "WSP methods" = "reference/methods.md" },
    { "Public API" = "reference/api.md" },
    { "Exit codes" = "reference/exit-codes.md" },
  ] },
  { "Development" = [
    "development/index.md",
    { "Contributing" = "development/contributing.md" },
    { "Testing" = "development/testing.md" },
  ] },
  { "Changelog" = "history/wspkit.md" },
]

[project.repo]
url = "https://github.com/pythonomenology/wspkit/"
name = "pythonomenology/wspkit"

[project.theme]
variant = "modern"
logo = "images/logo.png"
favicon = "images/logo.png"
custom_dir = "overrides"
font.text = "Inter"
font.code = "JetBrains Mono"
features = [
  "navigation.instant",        # load pages without a full reload (needs site_url)
  "navigation.instant.progress",  # thin progress bar on slower loads
  "navigation.tabs",           # top-level sections as a tab bar under the header
  "navigation.tabs.sticky",    # keep the tab bar pinned while scrolling
  "navigation.sections",       # render nested sections as sidebar groups
  "navigation.top",            # back-to-top button
  "navigation.tracking",       # update the URL with the active anchor
  "navigation.path",           # breadcrumbs above the page title
  "toc.follow",                # keep the active TOC anchor in view
  "content.code.copy",         # copy button on code blocks
  "content.code.annotate",     # inline code annotations
  "search.suggest",            # inline search completion
  "search.highlight",          # highlight matches on the opened page
  "navigation.indexes",        # a section's index.md is its landing page
  "announce.dismiss",          # dismissible announcement bar
]

# Light/dark palette with a header toggle. Each entry is one scheme; the
# toggle button switches between them (default = light, slate = dark).
[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/pythonomenology/wspkit"
name = "wspkit on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/wspkit/"
name = "wspkit on PyPI"

# Hover previews for internal links pointing at these pages.
[[project.markdown_extensions.zensical.extensions.preview.configurations]]
targets.include = [
  "concepts/*",
  "guides/*",
  "reference/*",
  "development/*",
  "getting-started.md",
]
