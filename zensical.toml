# Zensical configuration for the wspkit documentation site.
#
# Build:    hatch run docs:build
# Preview:  hatch run docs:serve  (then open http://localhost:8000)
# Deploy:   hatch run docs:deploy
#
# See https://zensical.org/docs/setup/basics/ for the full settings reference.

[project]
site_name = "wspkit"
site_description = "The whitespace between your workflow tool and everything that talks to it — a Python library implementing the Workflow Server Protocol (WSP)."
site_author = "Cary Hawkins"
site_url = "https://pythonomenology.github.io/wspkit/"
copyright = "&copy; 2026 Cary Hawkins"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Concepts" = [
    { "Protocol overview" = "concepts/protocol.md" },
    { "Lifecycle" = "concepts/lifecycle.md" },
    { "Error model" = "concepts/errors.md" },
    { "Transport & framing" = "concepts/transport.md" },
  ] },
  { "Guides" = [
    { "Embed wspkit in a workflow tool" = "guides/embed-library.md" },
    { "Ship a Config_File" = "guides/config-file.md" },
    { "Adapt an existing CLI" = "guides/adapt-cli.md" },
    { "Use the wsp CLI" = "guides/cli.md" },
  ] },
  { "Reference" = [
    { "WSP methods" = "reference/methods.md" },
    { "Public API" = "reference/api.md" },
    { "Exit codes" = "reference/exit-codes.md" },
  ] },
  { "Development" = [
    { "Contributing" = "development/contributing.md" },
    { "Testing" = "development/testing.md" },
  ] },
  { "Changelog" = "history/wspkit.md" },
]

[project.repo]
url = "https://github.com/pythonomenology/wspkit/"
name = "pythonomenology/wspkit"

[project.theme]
variant = "modern"
